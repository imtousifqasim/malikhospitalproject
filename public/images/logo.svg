<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <!-- Gradient for the Emblem Shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91" />
      <stop offset="100%" stop-color="#072254" />
    </linearGradient>

    <!-- Gradient for the Medical Cross & Pulse -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B3D91" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. ICON EMBLEM (Left, 52x52) -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Outer Shield / Rounded Square -->
    <rect x="0" y="0" width="52" height="52" rx="15" fill="url(#shieldGrad)" />
    <!-- Border Accent -->
    <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="14.25" stroke="#14B8A6" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Medical Cross (Clean, Rounded) -->
    <rect x="22" y="11" width="8" height="30" rx="4" fill="#FFFFFF" opacity="0.95" />
    <rect x="11" y="22" width="30" height="8" rx="4" fill="#FFFFFF" opacity="0.95" />

    <!-- Central Lifeline Pulse / Heartbeat Line (Teal Gradient) -->
    <path
      d="M10 26 L18 26 L22 17 L26 35 L30 22 L34 29 L37 26 L42 26"
      stroke="url(#tealGrad)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Glowing Heartbeat Dot -->
    <circle cx="26" cy="35" r="2" fill="#14B8A6" />
  </g>

  <!-- 2. BRAND TYPOGRAPHY (Right) -->
  <g transform="translate(68, 12)">
    <!-- Primary Title: MALIK MEDICAL -->
    <text x="0" y="19" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.03em" fill="#0B3D91">
      MALIK <tspan fill="#0D9488">MEDICAL</tspan>
    </text>

    <!-- Secondary Title: COMPLEX -->
    <text x="135" y="19" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.03em" fill="#0B3D91">
      COMPLEX
    </text>

    <!-- Subtitle & Location Tag -->
    <text x="0" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.12em" fill="#64748B">
      24/7 EMERGENCY &amp; MULTI-SPECIALTY
    </text>

    <!-- Urdu Badge / Chowk -->
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.06em" fill="#0D9488">
      ملک میڈیکل کمپلیکس • HUJRA SHAH MUQEEM
    </text>
  </g>
</svg>
